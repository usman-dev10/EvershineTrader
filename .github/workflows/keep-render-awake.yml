# Ping Render /health every 5 minutes so the free tier is less likely to sleep.
# Required: repo secret RENDER_HEALTH_URL = https://YOUR-SERVICE.onrender.com/health
#
# Note: GitHub cron can drift by a few minutes. For tighter wake-ups use
# https://cron-job.org or UptimeRobot pointing at the same URL (every 5–10 min).
# Hitting every second is unnecessary and wasteful — Render sleeps after ~15 min idle.

name: Keep Render awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$RENDER_HEALTH_URL" ]; then
            echo "Set GitHub secret RENDER_HEALTH_URL (e.g. https://xxx.onrender.com/health)"
            exit 0
          fi
          curl -fsS --max-time 60 "$RENDER_HEALTH_URL" || true
